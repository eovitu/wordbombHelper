<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WordBomb Helper</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <!-- Futuristic Minimalist Background Layer -->
        <div class="glow-bg"></div>

        <nav class="navbar glass-panel">
            <h1 class="logo">WordBomb<span class="highlight">.</span></h1>
            <div class="nav-links">
                <button class="nav-btn active" onclick="switchTab('manual')">Manual</button>
                <button class="nav-btn" onclick="switchTab('config')">Config</button>
            </div>
        </nav>

        <div id="manual-tab" class="tab-content active">
            <div class="card glass-panel game-card">
                <div class="word-display">
                    <span id="current-word">Waiting...</span>
                </div>

                <div class="input-group">
                    <input type="text" id="prompt-input" placeholder="Enter syllable prompt..." autocomplete="off"
                        autofocus>
                    <div class="input-highlight"></div>
                </div>

                <div class="priority-group-inline">
                    <label for="starts-with-input" class="inline-label">🚀 Starts With Letters:</label>
                    <input type="text" id="starts-with-input" class="inline-input" placeholder="e.g. k, y, w">
                </div>

                <div class="priority-group-inline">
                    <label for="priority-input" class="inline-label">🎯 Contains Priority Letters:</label>
                    <input type="text" id="priority-input" class="inline-input" placeholder="e.g. q, x, z">
                </div>

                <div class="priority-group-inline">
                    <label for="exclude-input" class="inline-label">🚫 Exclude Letters:</label>
                    <input type="text" id="exclude-input" class="inline-input" placeholder="e.g. y, w, k">
                </div>

                <div class="button-group">
                    <button class="action-btn reset-btn" onclick="resetWords()">Reset Used Words</button>
                </div>
            </div>
        </div>

        <div id="config-tab" class="tab-content">
            <div class="card glass-panel config-card">
                <div class="preset-management">
                    <div class="config-group">
                        <label>Config Presets</label>
                        <div class="preset-controls">
                            <select id="preset-selector">
                                <option value="" disabled selected>Selecione um preset...</option>
                                <!-- Populated by JS -->
                            </select>
                            <button class="action-btn primary-btn preset-btn" onclick="saveNewPreset()">Salvar Novo</button>
                            <button class="action-btn danger-btn preset-btn" onclick="deletePreset()">Remover</button>
                        </div>
                    </div>
                </div>

                <div class="config-divider"></div>

                <div class="config-group">
                    <label>Language</label>
                    <div class="language-selector" id="lang-selector">
                        <!-- Populated by JS -->
                    </div>
                </div>

                <div class="config-group" id="sublist-group" style="display:none">
                    <label>🎯 Sub-Lista Prioritária</label>
                    <select id="sublist-select">
                        <option value="">Nenhuma (usar lista principal)</option>
                        <!-- Populated by JS -->
                    </select>
                    <small id="sublist-hint" style="color: var(--text-muted, #888); font-size: 0.8rem; margin-top: 4px; display: block;">
                        Se encontrar a palavra nesta sub-lista, usa ela. Se não, cai na lista principal.
                    </small>
                </div>

                <div class="config-group">
                    <label>Strategy</label>
                    <select id="strategy-select">
                        <option value="random">Random</option>
                        <option value="shortest">Shortest</option>
                        <option value="longest">Longest</option>
                        <option value="hyphen">Hyphens</option>
                        <option value="alpha">Alphabetical (A-Z)</option>
                        <option value="recover">Recover Lives (Unplayed Letters)</option>
                    </select>
                </div>

                <div class="config-group double-input" id="recover-config-group">
                    <div>
                        <label>Recover Target</label>
                        <input type="number" id="recover-target" value="2" min="1" max="10">
                    </div>
                    <div>
                        <label>Recover Exclude</label>
                        <input type="text" id="recover-exclude" placeholder="w, y, k" style="width: 100%; padding: 1rem; background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-main); outline: none; font-family: inherit; font-size: 1rem; box-sizing: border-box; transition: border-color 0.3s ease;">
                    </div>
                </div>

                <div class="config-group double-input">
                    <div>
                        <label>Min Length</label>
                        <input type="number" id="min-len" value="1" min="1" max="46">
                    </div>
                    <div>
                        <label>Max Length</label>
                        <input type="number" id="max-len" value="46" min="1" max="46">
                    </div>
                </div>

                <div class="config-group double-input">
                    <div title="Busca palavras deste tamanho pra cima. Se não achar, ignora e busca qualquer uma.">
                        <label>Priority Min Len</label>
                        <input type="number" id="priority-min-len" value="1" min="1" max="46">
                    </div>
                    <div title="Busca palavras deste tamanho pra baixo. Se não achar, ignora e busca qualquer uma.">
                        <label>Priority Max Len</label>
                        <input type="number" id="priority-max-len" value="46" min="1" max="46">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>

</html>
