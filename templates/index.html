<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WordBomb Helper</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <main class="app">
        <header class="bar">
            <span class="brand">WORDBOMB<span class="dot">.</span></span>
            <span class="status"><i id="dot" class="dot-idle"></i><span id="status-text">Parado</span></span>
        </header>

        <!-- Palavra sugerida -->
        <section class="stage">
            <div id="prompt-line" class="prompt-line"></div>
            <div id="word" class="word">—</div>
            <div class="reroll" id="reroll-bar" hidden>
                <button class="btn-mini" onclick="rerollPrev()" title="Sugestão anterior (Ctrl+R)">◀</button>
                <span id="suggestion-count" class="suggestion-count"></span>
                <button class="btn-mini" onclick="rerollNext()" title="Próxima sugestão (Shift+R)">🔄</button>
            </div>
        </section>

        <!-- Controles -->
        <section class="controls">
            <button id="btn-toggle" class="btn btn-go" onclick="toggleAuto()">▶ Iniciar</button>
            <button class="btn" onclick="calibrate()">Calibrar</button>
            <button class="btn btn-ghost" onclick="resetWords()" title="Esquece palavras usadas (nova partida)">Reset</button>
        </section>
        <section class="controls">
            <button class="btn btn-ghost" onclick="calibrate('solve')" title="Calibre a área do painel SOLVE da extensão para aprender palavras já jogadas">Calibrar painel SOLVE</button>
            <span id="learned-badge" class="learned-badge" title="Palavras já jogadas aprendidas dos outros (Pipeline B)"></span>
        </section>

        <!-- Config -->
        <section class="cfg">
            <div class="field">
                <label>Idioma</label>
                <div id="langs" class="langs"></div>
            </div>

            <div class="field" id="sublist-field" hidden>
                <label>Sublista</label>
                <select id="sublist"><option value="">Lista principal</option></select>
            </div>

            <div class="field">
                <label>Estratégia</label>
                <select id="strategy">
                    <option value="random">Aleatória</option>
                    <option value="shortest">Mais curta</option>
                    <option value="longest">Mais longa</option>
                    <option value="alpha">Alfabética</option>
                    <option value="recover">Recover (cobrir letras)</option>
                </select>
            </div>

            <div class="field" id="recover-field" hidden>
                <label>Recover</label>
                <div class="row">
                    <input id="r-target" type="number" min="1" max="10" value="2" title="Alvo por letra">
                    <input id="r-exclude" type="text" placeholder="excluir: w, z" title="Letras a ignorar">
                </div>
            </div>

            <div class="field">
                <label>Filtros</label>
                <div class="grid">
                    <input id="f-contains" type="text" placeholder="contém">
                    <input id="f-starts"   type="text" placeholder="começa com">
                    <input id="f-finish"   type="text" placeholder="termina com">
                    <input id="f-exclude"  type="text" placeholder="exclui">
                </div>
                <div class="row len">
                    <span>Tamanho</span>
                    <input id="f-min" type="number" min="1" max="46" value="1">
                    <span>–</span>
                    <input id="f-max" type="number" min="1" max="46" value="46">
                </div>
            </div>
        </section>

        <!-- Log -->
        <section class="log" id="log"></section>

        <!-- Log de palavras aprendidas dos oponentes (Pipeline B) -->
        <div class="log-label">Palavras aprendidas (oponentes)</div>
        <section class="log log-learned" id="learned-log"></section>

        <!-- Prompts confirmados sem palavra no dicionário (manutenção; persiste entre execuções) -->
        <div class="log-label">Prompts sem palavra (faltando no dicionário)
            <button class="btn-mini" onclick="exportMissing()" title="Baixar TXT (um prompt por linha)">Export TXT</button>
        </div>
        <section class="log log-missing" id="missing-log"></section>

        <!-- Leituras OCR ambíguas que o Pipeline B NÃO marcou (revisão manual; persiste) -->
        <div class="log-label">OCR ambíguo (não marcado — revisar)
            <button class="btn-mini" onclick="exportAmbiguous()" title="Baixar TXT (uma leitura por linha)">Export TXT</button>
        </div>
        <section class="log log-ambiguous" id="ambiguous-log"></section>
    </main>

    <div id="overlay" class="overlay" hidden>
        <div class="overlay-box"><p id="overlay-text">Clique para calibrar</p><small>Clique aqui ou ESC para cancelar</small></div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
