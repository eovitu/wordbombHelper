<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WordBomb Helper</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <!-- Floating shapes for background -->
        <!-- Floating shapes removed for minimalist theme -->

        <nav class="navbar">
            <h1 class="logo">WordBomb <span class="highlight">Helper</span></h1>
            <div class="nav-links">
                <button class="nav-btn active" onclick="switchTab('manual')">Manual</button>
                <button class="nav-btn" onclick="switchTab('auto')">Auto-Play</button>
                <button class="nav-btn" onclick="switchTab('config')">Config</button>
            </div>
        </nav>

        <div id="manual-tab" class="tab-content active">
            <div class="card game-card">
                <div class="word-display">
                    <span id="current-word">Waiting...</span>
                </div>

                <div class="input-group">
                    <input type="text" id="prompt-input" placeholder="Enter syllable prompt..." autocomplete="off"
                        autofocus>
                    <div class="input-highlight"></div>
                </div>

                <div class="priority-group-inline">
                    <label for="priority-input" class="inline-label">🎯 Priority Letters:</label>
                    <input type="text" id="priority-input" class="inline-input" placeholder="e.g. q, x, z">
                </div>

                <div class="priority-group-inline">
                    <label for="exclude-input" class="inline-label">🚫 Exclude Letters:</label>
                    <input type="text" id="exclude-input" class="inline-input" placeholder="e.g. y, w, k">
                </div>

                <div class="button-group">
                    <button class="action-btn reset-btn" onclick="resetWords()">Reset Used Words</button>
                </div>
            </div>
        </div>

        <div id="auto-tab" class="tab-content">
            <div class="card auto-card">
                <div class="status-display">
                    <div class="status-indicator" id="auto-status-indicator"></div>
                    <span id="auto-status-text">Idle</span>
                </div>

                <div class="controls-group">
                    <button class="action-btn primary-btn" onclick="toggleAutoPlay()" id="autoplay-toggle-btn">Start
                        Auto-Play</button>
                    <button class="action-btn secondary-btn" onclick="startCalibration()">Calibrate Screen</button>
                </div>

                <div class="log-container">
                    <div id="auto-logs">
                        <div class="log-entry">System ready. Please calibrate first.</div>
                    </div>
                </div>
            </div>
        </div>

        <div id="config-tab" class="tab-content">
            <div class="card config-card">
                <div class="preset-management">
                    <div class="config-group">
                        <label>Config Presets</label>
                        <div class="preset-controls">
                            <select id="preset-selector">
                                <option value="" disabled selected>Select a preset...</option>
                                <!-- Populated by JS -->
                            </select>
                            <button class="action-btn primary-btn preset-btn" onclick="saveNewPreset()">Save
                                New</button>
                        </div>
                    </div>
                </div>

                <div class="config-divider"></div>

                <div class="config-group">
                    <label>Language</label>
                    <div class="language-selector" id="lang-selector">
                        <!-- Populated by JS -->
                    </div>
                </div>

                <div class="config-group">
                    <label>Strategy</label>
                    <select id="strategy-select">
                        <option value="random">Random</option>
                        <option value="shortest">Shortest</option>
                        <option value="longest">Longest</option>
                        <option value="hyphen">Hyphens</option>
                        <option value="alpha">Alphabetical (A-Z)</option>
                    </select>
                </div>

                <div class="config-group toggle-group">
                    <label>Simulate Typing</label>
                    <label class="switch">
                        <input type="checkbox" id="auto-type-toggle">
                        <span class="slider round"></span>
                    </label>
                </div>

                <div class="config-group">
                    <label>Speed (WPM): <span id="wpm-value">60</span></label>
                    <input type="range" id="wpm-slider" min="10" max="2000" value="60">
                </div>

                <div class="config-group">
                    <label>Error Rate (Typo): <span id="error-value">0</span>%</label>
                    <input type="range" id="error-slider" min="0" max="10" step="0.5" value="0">
                </div>

                <div class="config-group">
                    <label>Travadinha (Hesitation): <span id="travadinha-value">5</span>%</label>
                    <input type="range" id="travadinha-slider" min="0" max="100" step="1" value="5">
                </div>

                <div class="config-group">
                    <label>Chance Erro Total (Retry): <span id="retry-value">0</span>%</label>
                    <input type="range" id="retry-slider" min="0" max="2.5" step="0.1" value="0">
                </div>

                <div class="config-group">
                    <label>Chance Erro Tardo (Late): <span id="late-error-value">0</span>%</label>
                    <input type="range" id="late-error-slider" min="0" max="100" step="1" value="0">
                </div>

                <div class="config-group double-input">
                    <div>
                        <label>Max Erros (Typo): <span id="max-typos-value">2</span></label>
                        <input type="range" id="max-typos-slider" min="0" max="5" step="1" value="2">
                    </div>
                    <div>
                        <label>Max Erros (Late): <span id="max-late-value">1</span></label>
                        <input type="range" id="max-late-slider" min="0" max="5" step="1" value="1">
                    </div>
                </div>

                <div class="config-group double-input">
                    <div>
                        <label>Min Length</label>
                        <input type="number" id="min-len" value="1" min="1" max="46">
                    </div>
                    <div>
                        <label>Max Length</label>
                        <input type="number" id="max-len" value="46" min="1" max="46">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Calibration Overlay -->
    <div id="calibration-overlay" class="overlay hidden">
        <div class="overlay-content">
            <h2 id="calib-instruction">Click Top-Left of Turn Indicator</h2>
            <p>Click anywhere to cancel</p>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>

</html>
